name: Build & Sign Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build & Sign Android Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Angular Web Application
        run: npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Configure Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          elif [ -f "keystore/release.keystore" ]; then
            echo "Using committed repository release keystore..."
            cp keystore/release.keystore android/app/release.keystore
          else
            echo "⚠️ Keystore file not found! Checking fallback locations..."
          fi
          ls -la android/app/release.keystore || true

      - name: 🔧 Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Release APK & AAB via Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'DisciplineTracker2026!Key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'discipline_tracker' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'DisciplineTracker2026!Key' }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 🔍 Collect and Rename Signed Artifacts
        run: |
          mkdir -p dist-android
          
          # Find APK
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" dist-android/discipline-tracker-release.apk
          else
            echo "❌ Release APK not found!"
            exit 1
          fi

          # Find AAB (Android App Bundle for Google Play)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            echo "Found AAB: $AAB_PATH"
            cp "$AAB_PATH" dist-android/discipline-tracker-release.aab
          else
            echo "❌ Release AAB not found!"
            exit 1
          fi

          ls -lh dist-android/

      - name: 🛡️ Verify APK Signature
        run: |
          # Use apksigner from Android SDK Build-Tools to verify the signature
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android Build-Tools from: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose dist-android/discipline-tracker-release.apk

      - name: 📤 Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discipline-tracker-release-apk
          path: dist-android/discipline-tracker-release.apk
          if-no-files-found: error

      - name: 📤 Upload Signed AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discipline-tracker-release-aab
          path: dist-android/discipline-tracker-release.aab
          if-no-files-found: error

      - name: 📤 Upload All Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discipline-tracker-android-release
          path: dist-android/
          if-no-files-found: error

