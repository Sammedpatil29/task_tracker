<div class="discipline-loader-container" [class.fullscreen]="fullScreen" [class.size-sm]="size === 'small'" [class.size-lg]="size === 'large'">
  <div class="loader-visual">
    <!-- Outer glowing gradient ring -->
    <div class="spinner-ring"></div>
    <div class="spinner-ring inner"></div>
    
    <!-- Central flame symbol -->
    <div class="loader-center-icon">🔥</div>
  </div>

  <div class="loader-text-group">
    <p class="loader-title">{{ message }}</p>
    <p class="loader-subtitle" *ngIf="subMessage && size !== 'small'">{{ subMessage }}</p>
    <div class="loader-progress-bar" *ngIf="size !== 'small'">
      <div class="progress-indicator"></div>
    </div>
  </div>
</div>
