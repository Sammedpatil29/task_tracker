<!doctype html>
<html lang="en" data-theme="dark" class="dark-theme">
<head>
  <meta charset="utf-8">
  <title>Discipline Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <link rel="alternate icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('discipline_theme');
        if (saved === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-theme');
          document.documentElement.classList.add('light-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-theme');
          document.documentElement.classList.remove('light-theme');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="dark-theme">
  <app-root></app-root>
</body>
</html>
